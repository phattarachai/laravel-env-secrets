name: release-drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      # write, not read: the autolabeler APPLIES labels to the PR, and without write it
      # silently applies none. That matters because version-resolver reads those labels —
      # an unlabelled `feat:` PR resolves to the `default: patch` bump, so the draft comes
      # out a patch release when it should be a minor one.
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
